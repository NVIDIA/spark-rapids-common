name: "Signoff Check"
description: "A composite action to check if a PR got sign-off"
inputs:
  owner:
    description: "Repository Owner"
    required: true
  repo:
    description: "Repository name"
    required: true
  pull_number:
    description: "Pull request number"
    required: true
  token:
    description: "GitHub token"
    required: true
  image:
    description: "Public signoff runtime image; an explicit tag or digest must be accessible"
    required: false
    default: ghcr.io/nvidia/spark-rapids-common/signoff-check:v1

runs:
  using: "composite"
  steps:
    - name: Run Signoff Check in Docker
      shell: bash
      env:
        OWNER: ${{ inputs.owner }}
        REPO_NAME: ${{ inputs.repo }}
        GITHUB_TOKEN: ${{ inputs.token }}
        PULL_NUMBER: ${{ inputs.pull_number }}
        SIGNOFF_IMAGE: ${{ inputs.image }}
        SIGNOFF_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        docker_config=$(mktemp -d)
        trap 'rm -rf "$docker_config"' EXIT
        image="$SIGNOFF_IMAGE"

        if ! docker --config "$docker_config" pull "$image"; then
          if [[ "$image" != ghcr.io/nvidia/spark-rapids-common/signoff-check:v1 ]]; then
            echo "::error::The requested signoff image could not be pulled anonymously."
            exit 1
          fi
          echo "::warning::The public signoff image is unavailable; building the action's runtime locally."
          image="signoff-check:$(basename "$docker_config")"
          docker --config "$docker_config" build --pull --tag "$image" "$SIGNOFF_ACTION_PATH"
        fi

        # Keep the script tied to the caller's action revision, not a mutable image tag.
        docker --config "$docker_config" run --rm --interactive \
          --env OWNER --env REPO_NAME --env GITHUB_TOKEN --env PULL_NUMBER \
          --entrypoint python "$image" - < "$SIGNOFF_ACTION_PATH/signoff-check"
