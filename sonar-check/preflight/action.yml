name: Pre-Sonar workflow security
description: Audit approved workflow definitions on a hosted runner before internal execution
inputs:
  source-directory:
    description: Git worktree root within GITHUB_WORKSPACE; only committed definitions are audited
    default: .
  expected-sha:
    description: Full approved commit SHA checked out by the caller
    required: true
outputs:
  passed:
    description: True only when the entire security preflight passes
    value: ${{ steps.preflight.outputs.passed }}
  sha:
    description: Verified commit SHA; emitted only after a successful audit
    value: ${{ steps.preflight.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Audit committed workflow and action definitions
      id: preflight
      shell: bash
      env:
        PREFLIGHT_ACTION_PATH: ${{ github.action_path }}
        INPUT_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        INPUT_EXPECTED_SHA: ${{ inputs.expected-sha }}
      run: python3 -I "$PREFLIGHT_ACTION_PATH/../preflight.py"
