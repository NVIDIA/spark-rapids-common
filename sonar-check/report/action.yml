name: Report Sonar check
description: Publish exact-analysis Sonar evidence to its commit and pull request
inputs:
  result-path:
    description: Path to the schema 2 JSON result from the collector
    required: true
  pr-number:
    description: Pull request in the current repository
    required: true
  sha:
    description: Full analyzed commit SHA
    required: true
  source-attempt:
    description: Required producer run attempt, including when only the reporter is rerun
    required: true
  scan-result:
    description: Scan job result - success, failure, cancelled, or skipped
    required: true
  sonar-url:
    description: Expected HTTPS Sonar server base URL, including any context path
    required: true
  project:
    description: Expected Sonar project key
    required: true
  github-token:
    description: Default workflow token or user token with pull-requests write and statuses write permissions
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - name: Publish Sonar summary and commit status
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        SONAR_REPORT_ACTION_PATH: ${{ github.action_path }}
        SONAR_RESULT_PATH: ${{ inputs.result-path }}
        SONAR_PR_NUMBER: ${{ inputs.pr-number }}
        SONAR_SHA: ${{ inputs.sha }}
        SONAR_SOURCE_ATTEMPT: ${{ inputs.source-attempt }}
        SONAR_SCAN_RESULT: ${{ inputs.scan-result }}
        SONAR_URL: ${{ inputs.sonar-url }}
        SONAR_PROJECT_KEY: ${{ inputs.project }}
        SONAR_REPORT_ACTIONS_TOKEN: ${{ inputs.github-token == github.token }}
      with:
        github-token: ${{ inputs.github-token }}
        debug: false
        # A timed-out write may already have succeeded.
        retries: 0
        script: |
          const {report, optionsFromEnv} = require(
            require('node:path').join(process.env.SONAR_REPORT_ACTION_PATH, '..', 'report.js'));
          await report({github, core, context, options: optionsFromEnv(process.env)});
