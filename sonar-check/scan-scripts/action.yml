name: Scan scripts before Sonar
description: Inspect committed scripts and build files with an isolated Malcontent image
inputs:
  source-directory:
    description: Git worktree root within GITHUB_WORKSPACE
    default: .
  expected-sha:
    description: Full approved commit SHA checked out by the caller
    required: true
  image:
    description: Public prebuilt scanner runtime; a trusted tag or digest with Malcontent 1.28.1
    default: ghcr.io/nvidia/spark-rapids-common/sonar-script-scan:malcontent-1.28.1
outputs:
  passed:
    description: True only after complete scanning within the documented source scope
    value: ${{ steps.scan.outputs.passed }}
  sha:
    description: Approved commit SHA; emitted only when the scan passes
    value: ${{ steps.scan.outputs.sha }}
runs:
  using: composite
  steps:
    - name: Inspect source without executing it
      id: scan
      shell: bash
      env:
        SCRIPT_SCAN_ACTION_PATH: ${{ github.action_path }}
        INPUT_SOURCE_DIRECTORY: ${{ inputs.source-directory }}
        INPUT_EXPECTED_SHA: ${{ inputs.expected-sha }}
        INPUT_IMAGE: ${{ inputs.image }}
      run: python3 -I "$SCRIPT_SCAN_ACTION_PATH/../script_scan.py"
