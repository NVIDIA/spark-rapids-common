name: Runner queue fallback tests

on:
  pull_request:
    paths:
      - 'runner-queue-fallback/**'
      - '.github/workflows/runner-queue-fallback-test.yml'

permissions:
  contents: read

concurrency:
  group: runner-queue-fallback-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test CPU and GPU fallback without real dispatches or GitHub API calls
        run: node --test runner-queue-fallback/test/*.test.js
