name: add-to-project test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'add-to-project/**'
      - '.github/workflows/add-to-project-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s add-to-project -p 'test_*.py' -v
