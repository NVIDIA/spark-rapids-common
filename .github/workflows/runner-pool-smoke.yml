name: Runner pool smoke test

# copy-pr-bot mirrors trusted ready PRs or explicitly approved PR heads.
on:
  push:
    branches:
      - 'pull-request/[0-9]+'

permissions:
  contents: read

concurrency:
  group: runner-pool-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.repository == 'NVIDIA/spark-rapids-common' &&
      github.actor == 'copy-pr-bot[bot]'
    name: ${{ matrix.pool }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - pool: nv-cpu-general
            runner: linux-amd64-cpu16
            gpu: false
          - pool: nv-gpu-general
            runner: linux-amd64-gpu-l4-latest-1
            gpu: true
    env:
      SIGNOFF_IMAGE: ghcr.io/nvidia/spark-rapids-common/signoff-check@sha256:3db01d81815231e0a68c998a7b931602e888806ef32656483fe884dd55b184d8
    steps:
      - name: Checkout the tested revision
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check runner and Docker
        shell: bash
        run: |
          set -euo pipefail
          uname -sm
          nproc
          docker version
      - name: Identify the mirrored PR
        id: pr
        shell: bash
        run: |
          set -euo pipefail
          pr_number=${GITHUB_REF_NAME#pull-request/}
          [[ "$pr_number" =~ ^[0-9]+$ ]]
          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
      - name: Validate PR signoff using the published image
        uses: ./signoff-check
        with:
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          pull_number: ${{ steps.pr.outputs.number }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ env.SIGNOFF_IMAGE }}
      - name: Check GPU access on the host and in Docker
        if: matrix.gpu
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          docker run --rm --gpus all --entrypoint nvidia-smi "$SIGNOFF_IMAGE" \
            --query-gpu=name,driver_version,memory.total --format=csv

  publish-preview:
    needs: smoke
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/signoff-image.yml
