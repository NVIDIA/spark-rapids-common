name: Shimpler source tools

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'shimpler-source-tools/**'
      - '.github/workflows/shimpler-source-tools.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    if: "!contains(github.event.pull_request.title, '[bot]')"
    steps:
      - name: Checkout code
        uses: NVIDIA/spark-rapids-common/checkout@main

      - name: Run source tool tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s shimpler-source-tools/tests -p 'test_*.py' -v
