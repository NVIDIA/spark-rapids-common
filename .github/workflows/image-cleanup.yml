name: Image cleanup
on:
  schedule:
    - cron: '47 4 * * 0'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report candidates without deleting versions
        type: boolean
        default: true

permissions:
  contents: read

# Use the same lock as image-build.yml; never overlap publication and cleanup.
concurrency:
  group: daily-image-build
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/spark-rapids-common' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.catalog.outputs.images }}
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read image catalog
        id: catalog
        run: |
          images=$(jq -ce 'keys | select(length > 0)' .github/image-builds.json)
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: configure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    steps:
      - uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./ghcr-cleanup
        with:
          package: ${{ github.event.repository.name }}/${{ matrix.image }}
          tag-patterns: '["build-*"]'
          retention-days: '30'
          keep-latest: '5'
          max-delete: '20'
          dry-run: ${{ github.event_name != 'schedule' && inputs.dry-run }}
