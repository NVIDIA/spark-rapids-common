name: Daily image build

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-image-build
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/spark-rapids-common' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.catalog.outputs.images }}
    steps:
      - name: Checkout image catalog
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read configured images
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          images=$(jq -ce 'keys | select(length > 0)' .github/image-builds.json)
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  images:
    name: Build ${{ matrix.image }}
    needs: configure
    strategy:
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    runs-on: ubuntu-latest
    # Three 10-minute queues, a final 60-minute queue, one build, and API overhead.
    timeout-minutes: 150
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout trusted coordinator
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build image with CPU queue fallback
        uses: ./runner-queue-fallback
        with:
          workflow: image-build-worker.yml
          workflow-ref: main
          source-ref: ${{ github.ref }}
          source-sha: ${{ github.sha }}
          workload: ${{ toJSON(matrix) }}
          runner-type: cpu-amd64
          queue-policy: extended
          queue-timeout-minutes: '10'
          execution-timeout-minutes: '30'
