name: Daily image build

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-image-build
  cancel-in-progress: false

jobs:
  configure:
    if: >-
      github.repository == 'NVIDIA/spark-rapids-common' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.catalog.outputs.images }}
    steps:
      - name: Checkout image catalog
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read configured images
        id: catalog
        shell: bash
        run: |
          set -euo pipefail
          images=$(jq -ce 'keys | select(length > 0)' .github/image-builds.json)
          printf 'images=%s\n' "$images" >> "$GITHUB_OUTPUT"

  images:
    name: Build ${{ matrix.image }}
    needs: configure
    strategy:
      max-parallel: 1
      matrix:
        image: ${{ fromJSON(needs.configure.outputs.images) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select image from the trusted catalog
        id: image
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          config=$(jq -ce --arg name "$IMAGE_NAME" \
            '.[$name] | select(type == "object") | . + {image: $name}' .github/image-builds.json)
          printf 'config=%s\n' "$config" >> "$GITHUB_OUTPUT"
      - name: Set up emulation
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build, verify, and publish
        uses: ./container-image
        with:
          config: ${{ steps.image.outputs.config }}
          publish: 'true'
          token: ${{ secrets.GITHUB_TOKEN }}
