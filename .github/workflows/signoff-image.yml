name: Publish signoff image

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: signoff-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'NVIDIA/spark-rapids-common' &&
      ((github.ref == 'refs/heads/main' &&
        (github.event_name == 'workflow_dispatch' || vars.SIGNOFF_IMAGE_PUBLISH_ENABLED == 'true')) ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/pull-request/') &&
        github.actor == 'copy-pr-bot[bot]'))
    runs-on: linux-amd64-cpu16
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout image source
        uses: NVIDIA/spark-rapids-common/checkout@main
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up emulation
        uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build, verify, and publish
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ghcr.io/nvidia/spark-rapids-common/signoff-check
        run: |
          set -euo pipefail
          tag=v1
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            pr_number=${GITHUB_REF_NAME#pull-request/}
            [[ "$pr_number" =~ ^[0-9]+$ ]]
            tag="pr-$pr_number"
          fi
          anonymous_config=$(mktemp -d)
          metadata=$(mktemp)
          trap 'docker logout ghcr.io; rm -rf "$anonymous_config"; rm -f "$metadata"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

          candidate="$IMAGE:build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build --pull --platform linux/amd64,linux/arm64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$candidate" --metadata-file "$metadata" --push signoff-check
          digest=$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")
          reference="$IMAGE@$digest"

          # A public repository does not make a newly created GHCR package public.
          anonymous_access=true
          for platform in linux/amd64 linux/arm64; do
            if ! docker --config "$anonymous_config" pull --platform "$platform" "$reference"; then
              anonymous_access=false
              if [[ "$tag" == v1 ]]; then
                echo "::error::Anonymous image pull failed. Set the GHCR package visibility to public and rerun. The v1 tag has not been updated."
                exit 1
              fi
              # Preview publication bootstraps the package before its visibility is set.
              docker pull --platform "$platform" "$reference"
            fi
            docker run --rm --platform "$platform" "$reference" --help
            docker run --rm --interactive --platform "$platform" \
              --entrypoint python "$reference" - --help < signoff-check/signoff-check
          done

          docker buildx imagetools create --tag "$IMAGE:$tag" "$reference"
          printf 'Published %s:%s from %s. Both platforms passed CLI smoke checks. Anonymous pulls: %s.\n' \
            "$IMAGE" "$tag" "$reference" "$anonymous_access" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$anonymous_access" != true ]]; then
            echo "::warning::Preview image published, but anonymous pulls are unavailable. Set the GHCR package visibility to Public for credential-free consumers. The v1 tag is unchanged."
          fi
