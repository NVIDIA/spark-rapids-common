name: Workflow suite selector
description: Select required jobs from the PR diff for a push to pull-request/<number>
# Only supports push events on pull-request/<number> at the open PR's current head.
# The caller authorizes CI execution; this action does not check review/comment approval.
# Checkout github.sha first; grant contents: read and pull-requests: read.
# The caller owns the catalog: shared_paths affect every enabled suite,
# suites.<name>.paths define its scope (["**"] or omit for all files); jobs lists required jobs.
# exclude_paths filters within that scope, but cannot override shared_paths.
# Both path lists are repository-relative, not relative to each included directory.
# Suites default to enabled. To pause one, set enabled: false and explain why in comment.
# Disabled suites are never selected; the selector remains required by the final gate.
# Include/shared paths are exact files or directory prefixes ending in /.
# Only suite includes additionally accept the all-files ** token.
# Exclusions also accept globs such as **/*.md; mixed code/docs changes still run tests.
# Pass required-jobs to workflow-result-gate; include this selector in gate.needs.
inputs:
  catalog-path:
    description: JSON suite catalog path relative to the checked-out workspace
    required: true
  base-branch:
    description: Only accept PRs targeting this branch
    required: true
  selector-job:
    description: Caller job ID for this selector, always included in required-jobs
    required: true
  github-token:
    description: Token with read access to PR metadata and files
    default: ${{ github.token }}
outputs:
  suites:
    description: JSON array of selected suite names
    value: ${{ steps.select.outputs.suites }}
  required-jobs:
    description: JSON array containing the selector and selected workload job IDs
    value: ${{ steps.select.outputs.required-jobs }}
runs:
  using: composite
  steps:
    - name: Select suites from the full PR diff
      id: select
      uses: actions/github-script@v8
      env:
        SUITE_SELECTOR_ACTION_PATH: ${{ github.action_path }}
        SUITE_SELECTOR_CATALOG_PATH: ${{ inputs.catalog-path }}
        SUITE_SELECTOR_BASE_BRANCH: ${{ inputs.base-branch }}
        SUITE_SELECTOR_JOB: ${{ inputs.selector-job }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs');
          const path = require('node:path');
          const {select} = require(path.join(process.env.SUITE_SELECTOR_ACTION_PATH, 'index.js'));
          const catalog = JSON.parse(fs.readFileSync(path.resolve(
            process.env.GITHUB_WORKSPACE, process.env.SUITE_SELECTOR_CATALOG_PATH), 'utf8'));
          await select({github, context, core, catalog,
            baseBranch: process.env.SUITE_SELECTOR_BASE_BRANCH,
            selectorJob: process.env.SUITE_SELECTOR_JOB});
