name: Container image
description: Build and smoke-test images, optionally publishing verified GHCR candidates
inputs:
  config:
    description: Resolved image configuration as JSON; see README for its fields
    required: true
  publish:
    description: Publish to GHCR; only enable from a trusted publishing worker
    default: 'false'
  token:
    description: GHCR token with packages write permission; required only for publication
    default: ''
runs:
  using: node24
  main: index.js
