name: GPU child guard
description: Reject stale or orphaned GPU children before checking out workload code
inputs:
  github-token:
    description: Same-repository token with actions read and contents read permissions
    default: ${{ github.token }}
  request-id:
    description: Request ID supplied by the coordinator
    required: true
  parent-run-id:
    description: Coordinator run ID
    required: true
  parent-run-attempt:
    description: Coordinator run attempt
    required: true
  source-ref:
    description: Source ref supplied by the coordinator
    required: true
  source-sha:
    description: Approved source SHA supplied by the coordinator
    required: true
runs:
  using: node24
  main: index.js
