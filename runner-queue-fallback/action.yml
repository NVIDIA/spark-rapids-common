name: Runner queue fallback
description: Acquire one CPU or GPU worker per invocation, changing compatible pools only on queue timeout
inputs:
  github-token:
    description: Same-repository token with actions write and contents read permissions
    default: ${{ github.token }}
  workflow:
    description: Dedicated workflow_dispatch workflow filename in the calling repository
    required: true
  workflow-ref:
    description: Trusted branch or tag containing the child workflow, never a PR ref
    required: true
  source-ref:
    description: Source ref to monitor for changes, for example refs/pull/123/merge
    required: true
  source-sha:
    description: Full approved source SHA; must match source-ref throughout the run
    required: true
  runner-type:
    description: Required profile - cpu or gpu (amd64), cpu-arm64, gpu-arm64, or gpu-{amd64,arm64}-2gpu; explicit cpu-amd64 and gpu-amd64 also accepted
    # The family is mandatory. Unsuffixed GPU profiles request one GPU.
    required: true
  runners:
    description: Optional ordered JSON array replacing the selected profile's default pools; must match its family, architecture and GPU count
    # Linux defaults live in index.js. Override for restricted access or hardware requirements.
    required: false
  queue-policy:
    description: Standard preserves existing queues; extended uses CPU 10/GPU 15 minutes and a final 60-minute re-wait on eligible shared profiles
    default: standard
  workload:
    description: JSON object passed unchanged to the child, such as image digest and artifact run ID
    default: '{}'
  queue-timeout-minutes:
    description: Default queue limit from 1 to 60 minutes (standard 10, extended CPU 10/GPU 15); a candidate's queue-timeout-minutes takes precedence
    required: false
  execution-timeout-minutes:
    description: Maximum observed execution time, from 1 to 300 minutes; never retried
    default: '180'
outputs:
  run-id:
    description: Last dispatched child run ID
  run-url:
    description: Last dispatched child run URL
  runner:
    description: Last selected runner object as JSON
  attempts:
    description: Number of dispatched candidates
runs:
  using: node24
  main: index.js
  post: cleanup.js
  post-if: always()
